<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/fed868ac-0cc7-4d56-bc9f-30fe8b506df5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:inline-script',message:'HTML loaded, inline script executed',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run4',hypothesisId:'F'})}).catch(()=>{});
      // #endregion
      console.log('[HTML] Page loaded, inline script executed');
      
      // 全局错误捕获
      window.addEventListener('error', (event) => {
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/fed868ac-0cc7-4d56-bc9f-30fe8b506df5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:window-error',message:'Window error caught',data:{message:event.message,filename:event.filename,lineno:event.lineno,colno:event.colno,error:event.error?.message,stack:event.error?.stack},timestamp:Date.now(),sessionId:'debug-session',runId:'run4',hypothesisId:'F'})}).catch(()=>{});
        // #endregion
        console.error('[HTML] Window error:', event);
      });
      
      window.addEventListener('unhandledrejection', (event) => {
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/fed868ac-0cc7-4d56-bc9f-30fe8b506df5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:unhandled-rejection',message:'Unhandled promise rejection',data:{reason:event.reason?.message || String(event.reason),stack:event.reason?.stack},timestamp:Date.now(),sessionId:'debug-session',runId:'run4',hypothesisId:'F'})}).catch(()=>{});
        // #endregion
        console.error('[HTML] Unhandled rejection:', event);
      });
    </script>
    <script type="module">
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/fed868ac-0cc7-4d56-bc9f-30fe8b506df5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:module-script-start',message:'Module script starting, about to import main.js',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run4',hypothesisId:'F'})}).catch(()=>{});
      // #endregion
      console.log('[HTML] Module script starting, importing main.js');
      import('/src/main.js').catch((err) => {
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/fed868ac-0cc7-4d56-bc9f-30fe8b506df5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:import-error',message:'Failed to import main.js',data:{error:err?.message,stack:err?.stack},timestamp:Date.now(),sessionId:'debug-session',runId:'run4',hypothesisId:'F'})}).catch(()=>{});
        // #endregion
        console.error('[HTML] Failed to import main.js:', err);
        document.body.innerHTML = '<div style="padding:20px;color:red;font-family:monospace;">Failed to load main.js: ' + (err?.message || 'Unknown error') + '</div>';
      });
    </script>
  </body>
</html>
