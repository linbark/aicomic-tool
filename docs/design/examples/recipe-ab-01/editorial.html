<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor · 概念演示</title>
<style>
:root{--paper:#F9F8F9;--ink:#022C8D;--accent:#114882;--warm:#CE8131;--line:#C2B6A3;--source-paper:#FBFAFB;--space:8px}
*{box-sizing:border-box}
html{color-scheme:light;scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
.page{max-width:832px;margin:0 auto}
header{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{font-size:22px;font-weight:650;letter-spacing:-.04em}
.audience{font-size:14px;color:var(--accent)}
.hero{padding:80px 0 64px}
h1{font-size:72px;line-height:1.1;letter-spacing:-.065em;font-weight:600;margin:0 0 40px;text-wrap:balance}
.hero-bottom{display:grid;grid-template-columns:1.3fr 1fr;align-items:end;gap:48px}
.lede{font-size:18px;margin:0;max-width:23em;color:var(--accent);padding-left:24px;border-left:4px solid var(--warm)}
.actions{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.primary,.secondary{font-size:15px;padding:12px 18px;border:1px solid var(--ink);border-radius:3px;min-height:48px;text-align:center}
.primary{background:var(--ink);color:var(--paper)}
.secondary{background:var(--source-paper);color:var(--accent);border-color:var(--line)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--ink);padding:32px 0 56px}
.feature h2{font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.025em;margin:0 0 16px}
p{margin:0;font-size:18px;color:var(--accent)}
.process{display:grid;grid-template-columns:1fr 1fr;gap:64px;padding:40px 0 48px;border-top:1px solid var(--line)}
.process h2{font-size:32px;line-height:1.35;letter-spacing:-.04em;font-weight:600;margin:0;max-width:8em;text-wrap:balance}
.steps{display:flex;flex-direction:column;gap:0}
.step{font-size:18px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:first-child{padding-top:0}
.closing{border-top:1px solid var(--ink);padding:40px 0 32px}
.closing h2{font-size:30px;line-height:1.4;letter-spacing:-.035em;font-weight:600;margin:0;max-width:18em}
footer{font-size:14px;line-height:1.5;color:var(--accent);padding:24px 0 40px;border-top:1px solid var(--line)}
@media(max-width:960px){.page{margin:0 32px}h1{font-size:48px}.hero-bottom,.process{grid-template-columns:1fr;gap:28px}.features{grid-template-columns:1fr;gap:32px}.audience{max-width:12em;text-align:right}.actions{align-items:flex-start}}
</style>
</head>
<body>
<main class="page">
<header><span class="brand">Harbor</span><span class="audience">面向独立开发者与小团队</span></header>
<section class="hero">
<h1>发布本该安静地发生。</h1>
<div class="hero-bottom"><p class="lede">把部署、回滚与灰度收进一条清楚的时间线。</p><div class="actions"><a class="primary" href="#start">使用 Git 账号开始</a><a class="secondary" href="#features">看一次发布</a></div></div>
</section>
<section class="features" id="features">
<article class="feature"><h2>一条时间线</h2><p>从改动到上线，让每一步都有清楚的来路。</p></article>
<article class="feature"><h2>回滚有来路</h2><p>保留每次发布的上下文，而不是只留一条成功通知。</p></article>
<article class="feature"><h2>灰度有边界</h2><p>每次扩大流量前停一下，确认系统仍在预期之内。</p></article>
</section>
<section class="process" id="start"><h2>一个开始，三步完成。</h2><div class="steps"><span class="step">连接代码</span><span class="step">选择服务</span><span class="step">提交发布</span></div></section>
<section class="closing"><h2>用更少界面，讲清每次变化。</h2></section>
<footer>产品概念演示，功能与文案均为占位。</footer>
</main>
</body>
</html>
