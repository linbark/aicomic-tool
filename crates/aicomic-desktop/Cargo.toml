[package]
name = "aicomic-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "aicomic-tool"
path = "src/main.rs"

[dependencies]
aicomic-core = { path = "../aicomic-core" }
aicomic-ai = { path = "../aicomic-ai" }
aicomic-memory = { path = "../aicomic-memory", features = ["local-bge"] }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "image", "advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
rfd = "0.15"
open = "5"
png = "0.18"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
