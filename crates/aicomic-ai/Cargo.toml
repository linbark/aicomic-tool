[package]
name = "aicomic-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust AI workflows, prompt registry and compatible run storage"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
