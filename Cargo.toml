[workspace]
members = ["crates/aicomic-core", "crates/aicomic-ai", "crates/aicomic-memory", "crates/aicomic-desktop"]
default-members = ["crates/aicomic-desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
